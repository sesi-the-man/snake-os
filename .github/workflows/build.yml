name: Build image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out (with Buildroot submodule)
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0   # needed for "git describe" version names

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: .buildroot_dl
          key: buildroot-dl-${{ hashFiles('br2-external/configs/*', '.gitmodules') }}
          restore-keys: buildroot-dl-

      - name: Build
        run: docker compose run --rm build --legal-info

      - name: Make build outputs readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" images .buildroot_dl || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake_os-${{ github.ref_name }}
          path: images/*

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" images/* \
            --draft --title "$GITHUB_REF_NAME" \
            --notes-file docs/release-notes-template.md
